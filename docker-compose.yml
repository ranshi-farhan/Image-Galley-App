services:
  web:
    build: .
    image: gallery-app:latest
    container_name: gallery-web
    env_file: .env
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "${GUNICORN_WORKERS}", "${GUNICORN_APP}"]
    ports:
      - "127.0.0.1:${APP_PORT}:8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
